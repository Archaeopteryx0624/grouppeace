<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Peace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f7f5f0;
  --surface:#ffffff;
  --ink:#1c1c1e;
  --ink2:#636366;
  --line:#e0ddd8;
  --accent:#2d6a4f;
  --accent-light:#e8f5ee;
  --warn:#c0392b;
  --gold:#b5833a;
  --radius:8px;
  --font-body:'Jost',sans-serif;
  --font-display:'Lora',serif;
  --shadow:0 2px 16px rgba(0,0,0,.07);
  --shadow-lg:0 8px 40px rgba(0,0,0,.13);
}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.5;}

/* ── Auth ─────────────────────────────── */
#authWrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#1c3a2e 0%,#0f2318 100%);padding:20px;
}
.auth-box{
  background:var(--surface);border-radius:14px;padding:44px 40px;width:100%;max-width:400px;
  box-shadow:var(--shadow-lg);
}
.auth-box h1{font-family:var(--font-display);font-size:1.9rem;font-weight:600;text-align:center;margin-bottom:4px;}
.auth-box .sub{text-align:center;color:var(--ink2);font-size:.88rem;margin-bottom:28px;}
.seg{display:flex;background:var(--bg);border-radius:var(--radius);padding:3px;margin-bottom:22px;gap:3px;}
.seg button{
  flex:1;padding:9px;border:none;background:none;border-radius:6px;
  font-family:var(--font-body);font-size:.9rem;font-weight:500;color:var(--ink2);cursor:pointer;transition:.18s;
}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin-bottom:5px;}
.field input{
  width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--radius);
  font-family:var(--font-body);font-size:.95rem;color:var(--ink);background:var(--surface);transition:.18s;
}
.field input:focus{outline:none;border-color:var(--accent);}
.btn-main{
  width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
  font-family:var(--font-body);font-size:.95rem;font-weight:600;cursor:pointer;transition:.18s;margin-top:2px;
}
.btn-main:hover{background:#245a42;}
.btn-main:disabled{opacity:.5;cursor:not-allowed;}
.msg-box{margin-top:12px;padding:10px 14px;border-radius:var(--radius);font-size:.88rem;display:none;}
.msg-box.err{background:#fdf0f0;color:var(--warn);border:1px solid #f5c6c6;display:block;}
.msg-box.ok{background:var(--accent-light);color:var(--accent);border:1px solid #b7dfca;display:block;}

/* ── App shell ────────────────────────── */
#app{display:none;flex-direction:column;min-height:100vh;}
#app.on{display:flex;}

.topbar{
  background:var(--surface);border-bottom:1.5px solid var(--line);
  padding:0 28px;display:flex;align-items:stretch;justify-content:space-between;
  position:sticky;top:0;z-index:50;box-shadow:var(--shadow);
}
.brand{
  display:flex;align-items:center;gap:9px;font-family:var(--font-display);
  font-size:1.1rem;font-weight:600;color:var(--ink);padding:14px 0;text-decoration:none;
}
.tabs{display:flex;align-items:stretch;}
.tab{
  padding:0 20px;background:none;border:none;border-bottom:3px solid transparent;
  font-family:var(--font-body);font-size:.88rem;font-weight:500;color:var(--ink2);
  cursor:pointer;transition:.18s;white-space:nowrap;
}
.tab:hover{color:var(--accent);background:var(--bg);}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;padding:12px 0;}
.av{
  width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;
  cursor:pointer;border:2px solid var(--line);overflow:hidden;flex-shrink:0;
}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.logout{
  padding:6px 13px;background:none;border:1.5px solid var(--line);border-radius:var(--radius);
  font-family:var(--font-body);font-size:.82rem;color:var(--ink2);cursor:pointer;transition:.18s;
}
.logout:hover{border-color:var(--warn);color:var(--warn);}

.main{flex:1;max-width:880px;width:100%;margin:0 auto;padding:28px 20px;}
.panel{display:none;}
.panel.on{display:block;}

/* ── Chat ─────────────────────────────── */
.chat-wrap{display:grid;grid-template-columns:1fr 200px;gap:18px;height:calc(100vh - 155px);}
.chat-col{display:flex;flex-direction:column;min-height:0;}
.chat-box{
  flex:1;overflow-y:auto;background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;
}
.chat-form{display:flex;gap:8px;margin-top:10px;}
.chat-form input{
  flex:1;padding:10px 15px;border:1.5px solid var(--line);border-radius:var(--radius);
  font-family:var(--font-body);font-size:.92rem;outline:none;transition:.18s;
}
.chat-form input:focus{border-color:var(--accent);}
.chat-form button{
  padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
  font-weight:600;cursor:pointer;transition:.18s;
}
.chat-form button:hover{background:#245a42;}
.msg{max-width:72%;padding:9px 13px;border-radius:var(--radius);font-size:.9rem;line-height:1.5;}
.msg.mine{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:2px;}
.msg.theirs{background:var(--bg);color:var(--ink);align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:2px;}
.msg-who{font-size:.75rem;opacity:.7;margin-bottom:3px;display:flex;align-items:center;gap:5px;}
.mini-av{width:16px;height:16px;border-radius:50%;background:var(--gold);color:#fff;font-size:.6rem;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0;}
.mini-av img{width:100%;height:100%;object-fit:cover;}
.sidebar-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;}
.sidebar-card h4{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:10px;}
.online-item{display:flex;align-items:center;gap:7px;font-size:.88rem;margin-bottom:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;}

/* ── Blogs ────────────────────────────── */
.blogs-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.blogs-head h2{font-family:var(--font-display);font-size:1.5rem;}
.btn-accent{
  padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
  font-family:var(--font-body);font-size:.88rem;font-weight:600;cursor:pointer;transition:.18s;
}
.btn-accent:hover{background:#245a42;}
.blog-card{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:22px;margin-bottom:16px;cursor:pointer;transition:.18s;
}
.blog-card:hover{border-color:var(--accent);box-shadow:var(--shadow);}
.blog-card-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.card-av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1.5px solid var(--line);}
.card-av img{width:100%;height:100%;object-fit:cover;}
.card-meta .name{font-weight:600;font-size:.88rem;}
.card-meta .ts{font-size:.78rem;color:var(--ink2);}
.blog-title{font-family:var(--font-display);font-size:1.15rem;font-weight:600;margin-bottom:7px;}
.blog-preview{font-size:.88rem;color:var(--ink2);line-height:1.6;margin-bottom:10px;}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.tag{padding:2px 9px;background:var(--bg);border-radius:20px;font-size:.76rem;color:var(--ink2);border:1px solid var(--line);}
.card-foot{display:flex;gap:16px;border-top:1.5px solid var(--line);padding-top:10px;}
.card-foot button{background:none;border:none;font-family:var(--font-body);font-size:.85rem;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:5px;padding:3px 0;transition:.18s;}
.card-foot button:hover{color:var(--accent);}
.card-foot button.liked{color:var(--warn);}

/* ── Gallery ──────────────────────────── */
.gallery-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.gallery-head h2{font-family:var(--font-display);font-size:1.5rem;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.g-item{aspect-ratio:1;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--line);cursor:pointer;transition:.18s;position:relative;background:var(--bg);}
.g-item:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow);}
.g-item img{width:100%;height:100%;object-fit:cover;}
.g-overlay{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65));opacity:0;transition:.18s;display:flex;align-items:flex-end;padding:9px;}
.g-item:hover .g-overlay{opacity:1;}
.g-overlay-text{color:#fff;font-size:.76rem;}

/* ── Profile ──────────────────────────── */
.profile-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:32px;max-width:500px;margin:0 auto;}
.profile-av-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:24px;}
.big-av{
  width:86px;height:86px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.9rem;font-weight:700;
  margin-bottom:11px;border:3px solid var(--line);overflow:hidden;cursor:pointer;
}
.big-av img{width:100%;height:100%;object-fit:cover;}
.change-photo{font-size:.84rem;color:var(--accent);cursor:pointer;font-weight:500;}
.save-row{display:flex;justify-content:flex-end;margin-top:10px;}
.btn-save{
  padding:10px 26px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
  font-family:var(--font-body);font-weight:600;cursor:pointer;transition:.18s;
}
.btn-save:hover{background:#245a42;}

/* ── Modal ────────────────────────────── */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px;}
.backdrop.on{display:flex;}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:540px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
.modal-head{padding:20px 24px;border-bottom:1.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.modal-head h3{font-family:var(--font-display);font-size:1.1rem;}
.modal-x{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--ink2);line-height:1;padding:2px;}
.modal-body{padding:22px 24px;overflow-y:auto;}
.modal-foot{padding:14px 24px;border-top:1.5px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-shrink:0;}
textarea{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:var(--radius);font-family:var(--font-body);font-size:.92rem;resize:vertical;min-height:110px;}
textarea:focus{outline:none;border-color:var(--accent);}
.btn-cancel{padding:9px 18px;background:none;border:1.5px solid var(--line);border-radius:var(--radius);font-family:var(--font-body);font-size:.88rem;color:var(--ink2);cursor:pointer;transition:.18s;}
.btn-cancel:hover{border-color:var(--ink2);}
.detail-body{font-size:.93rem;line-height:1.8;white-space:pre-wrap;border-left:3px solid var(--line);padding-left:18px;margin:16px 0;color:var(--ink);}
.comment-card{padding:11px;background:var(--bg);border-radius:var(--radius);margin-bottom:9px;border:1px solid var(--line);}
.comment-name{font-weight:600;font-size:.85rem;margin-bottom:3px;}
.comment-text{font-size:.88rem;line-height:1.5;}
.comment-ts{font-size:.75rem;color:var(--ink2);margin-top:3px;}

/* ── Toast ────────────────────────────── */
.toast{
  position:fixed;bottom:22px;right:22px;z-index:300;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--radius);
  font-size:.88rem;box-shadow:var(--shadow-lg);pointer-events:none;
  transform:translateY(10px);opacity:0;transition:.25s;max-width:280px;
}
.toast.on{transform:translateY(0);opacity:1;}
.toast.err{background:var(--warn);}
.toast.ok{background:var(--accent);}

/* ── Misc ─────────────────────────────── */
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.center{display:flex;justify-content:center;padding:40px;}
.empty{text-align:center;padding:60px 20px;color:var(--ink2);}
.empty .ico{font-size:2.6rem;margin-bottom:10px;}
.prog-wrap{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px;display:none;}
.prog-bar{height:100%;background:var(--accent);width:0%;transition:width .3s;}

@media(max-width:680px){
  .chat-wrap{grid-template-columns:1fr;}
  .chat-sidebar{display:none;}
  .tabs .tab{padding:0 11px;font-size:.8rem;}
  .topbar{padding:0 12px;}
  .main{padding:16px 12px;}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authWrap">
  <div class="auth-box">
    <h1>🕊️ Group Peace</h1>
    <p class="sub">Your local community network</p>
    <div class="seg">
      <button class="on" id="tabLogin" onclick="setMode('login')">Sign In</button>
      <button id="tabReg" onclick="setMode('register')">Register</button>
    </div>
    <div class="field"><label>Username</label><input id="aUser" type="text" autocomplete="username" placeholder="your_username"></div>
    <div class="field"><label>Password</label><input id="aPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn-main" id="aBtn" onclick="doAuth()">Sign In</button>
    <div class="msg-box" id="aMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="topbar">
    <a class="brand" href="#">🕊️ Group Peace</a>
    <nav class="tabs">
      <button class="tab on" data-tab="chat" onclick="showTab('chat')">💬 Chat</button>
      <button class="tab" data-tab="blogs" onclick="showTab('blogs')">📝 Blogs</button>
      <button class="tab" data-tab="gallery" onclick="showTab('gallery')">📸 Gallery</button>
      <button class="tab" data-tab="profile" onclick="showTab('profile')">👤 Profile</button>
    </nav>
    <div class="topbar-right">
      <div class="av" id="topAv" onclick="showTab('profile')"></div>
      <span id="topName" style="font-size:.88rem;font-weight:500;"></span>
      <button class="logout" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <main class="main">

    <!-- CHAT -->
    <div class="panel on" id="panel-chat">
      <div class="chat-wrap">
        <div class="chat-col">
          <div class="chat-box" id="chatBox"><div class="center"><div class="spin"></div></div></div>
          <div class="chat-form">
            <input id="chatIn" placeholder="Message everyone…" onkeydown="if(event.key==='Enter')sendMsg()">
            <button onclick="sendMsg()">Send</button>
          </div>
        </div>
        <div class="chat-sidebar">
          <div class="sidebar-card">
            <h4>Members</h4>
            <div id="memberList"><div class="center"><div class="spin"></div></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- BLOGS -->
    <div class="panel" id="panel-blogs">
      <div class="blogs-head">
        <h2>Community Blog</h2>
        <button class="btn-accent" onclick="openModal('newPostModal')">+ New Post</button>
      </div>
      <div id="blogList"><div class="center"><div class="spin"></div></div></div>
    </div>

    <!-- GALLERY -->
    <div class="panel" id="panel-gallery">
      <div class="gallery-head">
        <h2>Gallery</h2>
        <button class="btn-accent" onclick="g('galleryFile').click()">↑ Upload</button>
        <input type="file" id="galleryFile" accept="image/*,video/*" multiple style="display:none" onchange="uploadGallery(event)">
      </div>
      <div class="prog-wrap" id="progWrap"><div class="prog-bar" id="progBar"></div></div>
      <div class="gallery-grid" id="galleryGrid"><div class="center" style="grid-column:1/-1"><div class="spin"></div></div></div>
    </div>

    <!-- PROFILE -->
    <div class="panel" id="panel-profile">
      <div class="profile-card">
        <div class="profile-av-wrap">
          <div class="big-av" id="bigAv" onclick="g('avFile').click()"></div>
          <span class="change-photo" onclick="g('avFile').click()">Change photo</span>
          <input type="file" id="avFile" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
        </div>
        <div class="field"><label>Display Name</label><input id="pName" type="text" placeholder="How others see you"></div>
        <div class="field"><label>Bio</label><textarea id="pBio" style="min-height:72px" placeholder="Tell people about yourself…"></textarea></div>
        <div class="save-row"><button class="btn-save" onclick="saveProfile()">Save</button></div>
        <div class="msg-box" id="pMsg" style="margin-top:10px;"></div>
      </div>
    </div>

  </main>
</div>

<!-- NEW POST MODAL -->
<div class="backdrop" id="newPostModal">
  <div class="modal">
    <div class="modal-head"><h3>New Post</h3><button class="modal-x" onclick="closeModal('newPostModal')">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Title</label><input id="postTitle" type="text" placeholder="Post title…"></div>
      <div class="field" style="margin-top:12px"><label>Content</label><textarea id="postBody" style="min-height:150px" placeholder="Write your post…"></textarea></div>
      <div class="field" style="margin-top:12px"><label>Tags (comma-separated)</label><input id="postTags" type="text" placeholder="news, events, tech"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal('newPostModal')">Cancel</button>
      <button class="btn-accent" onclick="submitPost()">Publish</button>
    </div>
  </div>
</div>

<!-- BLOG DETAIL MODAL -->
<div class="backdrop" id="blogModal">
  <div class="modal" style="max-width:660px">
    <div class="modal-head"><h3 id="blogModalTitle" style="font-size:1rem;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></h3><button class="modal-x" onclick="closeModal('blogModal')">×</button></div>
    <div class="modal-body">
      <div id="blogModalContent"></div>
      <div style="margin-top:24px;border-top:1.5px solid var(--line);padding-top:18px;">
        <h4 id="commentHeading" style="font-family:var(--font-display);font-size:1rem;margin-bottom:14px;"></h4>
        <div id="commentList"></div>
        <div style="margin-top:14px;display:flex;gap:9px;">
          <textarea id="commentIn" style="min-height:54px" placeholder="Add a comment…"></textarea>
          <button class="btn-accent" style="align-self:flex-start;white-space:nowrap" onclick="submitComment()">Post</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- GALLERY VIEWER MODAL -->
<div class="backdrop" id="viewerModal">
  <div class="modal" style="max-width:680px">
    <div class="modal-head"><h3 id="viewerTitle">Photo</h3><button class="modal-x" onclick="closeModal('viewerModal')">×</button></div>
    <div class="modal-body" style="text-align:center">
      <div id="viewerContent"></div>
      <div id="viewerInfo" style="margin-top:11px;font-size:.82rem;color:var(--ink2);"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────
const API = '/.netlify/functions/api';

// ── State ───────────────────────────────────────────────────────────
let token    = localStorage.getItem('gp_token')    || '';
let username = localStorage.getItem('gp_username') || '';
let profile  = {};
let mode     = 'login';
let currentBlogId = null;
let chatMsgs = [];
let pollTimer = null;

// ── Helpers ─────────────────────────────────────────────────────────
const g = id => document.getElementById(id);

async function call(method, path, body) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
    },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res  = await fetch(API + path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function toast(msg, type = '') {
  const el = g('toast');
  el.textContent = msg;
  el.className = 'toast on' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 3000);
}

function ts(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60)    return 'just now';
  if (s < 3600)  return Math.floor(s/60)  + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function inits(name) {
  return (name || '?').split(' ').map(w => w[0]).join('').substr(0,2).toUpperCase();
}

function mkAv(url, name, size = 36) {
  const d = document.createElement('div');
  d.style.cssText = `width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;background:var(--accent);color:#fff;font-weight:700;font-size:${Math.floor(size*.33)}px;display:flex;align-items:center;justify-content:center;flex-shrink:0;`;
  if (url) {
    const i = document.createElement('img');
    i.src = url; i.style.cssText = 'width:100%;height:100%;object-fit:cover;';
    i.onerror = () => { d.innerHTML = ''; d.textContent = inits(name); };
    d.appendChild(i);
  } else { d.textContent = inits(name); }
  return d;
}

function openModal(id)  { g(id).classList.add('on'); }
function closeModal(id) { g(id).classList.remove('on'); }

// ── Auth ─────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  g('tabLogin').classList.toggle('on', m === 'login');
  g('tabReg').classList.toggle('on',   m === 'register');
  g('aBtn').textContent = m === 'login' ? 'Sign In' : 'Create Account';
  g('aMsg').className = 'msg-box';
  g('aMsg').textContent = '';
}

async function doAuth() {
  const u = g('aUser').value.trim();
  const p = g('aPass').value;
  if (!u || !p) { showAuthMsg('Please fill in all fields', 'err'); return; }
  g('aBtn').disabled = true;
  g('aBtn').textContent = 'Please wait…';
  try {
    const d = await call('POST', '/auth/' + mode, { username: u, password: p });
    token    = d.token;
    username = d.username;
    localStorage.setItem('gp_token',    token);
    localStorage.setItem('gp_username', username);
    startApp();
  } catch (e) {
    showAuthMsg(e.message, 'err');
  } finally {
    g('aBtn').disabled = false;
    setMode(mode);
  }
}

function showAuthMsg(msg, type) {
  const el = g('aMsg');
  el.textContent = msg;
  el.className   = 'msg-box ' + type;
}

function doLogout() {
  clearInterval(pollTimer);
  token = ''; username = '';
  localStorage.removeItem('gp_token');
  localStorage.removeItem('gp_username');
  g('app').classList.remove('on');
  g('authWrap').style.display = 'flex';
}

// ── App boot ─────────────────────────────────────────────────────────
function startApp() {
  g('authWrap').style.display = 'none';
  g('app').classList.add('on');
  g('topName').textContent = username;
  loadProfile();
  loadChat();
  loadBlogs();
  loadGallery();
  loadMembers();
  startPoll();
}

async function loadProfile() {
  try {
    profile = await call('GET', '/profile/' + username);
    renderTopAv();
    renderBigAv();
    g('pName').value = profile.displayName || '';
    g('pBio').value  = profile.bio || '';
  } catch (_) {}
}

function renderTopAv() {
  const el = g('topAv');
  el.innerHTML = '';
  if (profile.avatarUrl) {
    const i = document.createElement('img');
    i.src = profile.avatarUrl;
    i.onerror = () => { el.innerHTML = ''; el.textContent = inits(profile.displayName || username); };
    el.appendChild(i);
  } else { el.textContent = inits(profile.displayName || username); }
}

function renderBigAv() {
  const el = g('bigAv');
  el.innerHTML = '';
  if (profile.avatarUrl) {
    const i = document.createElement('img');
    i.src = profile.avatarUrl;
    i.onerror = () => { el.innerHTML = ''; el.textContent = inits(profile.displayName || username); };
    el.appendChild(i);
  } else { el.textContent = inits(profile.displayName || username); }
}

// ── Tabs ─────────────────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  g('panel-' + tab).classList.add('on');
}

// ── Chat ─────────────────────────────────────────────────────────────
async function loadChat() {
  try {
    chatMsgs = await call('GET', '/messages');
    renderChat();
  } catch (_) { g('chatBox').innerHTML = '<div class="empty"><p>Could not load messages.</p></div>'; }
}

function renderChat() {
  const box = g('chatBox');
  if (!chatMsgs.length) {
    box.innerHTML = '<div class="empty"><div class="ico">💬</div><p>No messages yet. Say hello!</p></div>';
    return;
  }
  box.innerHTML = '';
  chatMsgs.forEach(m => appendMsg(m, false));
  box.scrollTop = box.scrollHeight;
}

function appendMsg(m, scroll = true) {
  const box = g('chatBox');
  box.querySelector('.spin')?.closest('.center')?.remove();
  box.querySelector('.empty')?.remove();

  const mine = m.user === username;
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (mine ? 'mine' : 'theirs');

  if (!mine) {
    const who = document.createElement('div');
    who.className = 'msg-who';
    const av = document.createElement('div');
    av.className = 'mini-av';
    if (m.avatarUrl) {
      const i = document.createElement('img'); i.src = m.avatarUrl; av.appendChild(i);
    } else { av.textContent = inits(m.displayName || m.user); }
    who.appendChild(av);
    who.insertAdjacentHTML('beforeend', `<span>${m.displayName || m.user}</span><span>${ts(m.timestamp)}</span>`);
    wrap.appendChild(who);
  }

  const body = document.createElement('div');
  body.textContent = m.message;
  wrap.appendChild(body);
  box.appendChild(wrap);
  if (scroll) box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  const input = g('chatIn');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    const m = await call('POST', '/messages', { message: text });
    appendMsg(m);
  } catch (e) { toast(e.message, 'err'); }
}

async function loadMembers() {
  try {
    const users = await call('GET', '/users');
    const list  = g('memberList');
    list.innerHTML = '';
    users.slice(0, 25).forEach(u => {
      const d = document.createElement('div');
      d.className = 'online-item';
      d.innerHTML = `<div class="dot"></div><span>${u.displayName || u.username}</span>`;
      list.appendChild(d);
    });
  } catch (_) {}
}

function startPoll() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const msgs = await call('GET', '/messages');
      if (msgs.length > chatMsgs.length) {
        msgs.slice(chatMsgs.length).forEach(m => appendMsg(m));
        chatMsgs = msgs;
      }
    } catch (_) {}
  }, 5000);
}

// ── Blogs ─────────────────────────────────────────────────────────────
let blogs = [];

async function loadBlogs() {
  try {
    blogs = await call('GET', '/blogs');
    renderBlogs();
  } catch (_) { g('blogList').innerHTML = '<div class="empty"><p>Could not load posts.</p></div>'; }
}

function renderBlogs() {
  const c = g('blogList');
  if (!blogs.length) { c.innerHTML = '<div class="empty"><div class="ico">📝</div><p>No posts yet. Be the first!</p></div>'; return; }
  c.innerHTML = '';
  blogs.forEach(b => c.appendChild(blogCard(b)));
}

function blogCard(b) {
  const card = document.createElement('div');
  card.className = 'blog-card';
  card.innerHTML = `
    <div class="blog-card-top">
      <div id="cav-${b.id}"></div>
      <div class="card-meta">
        <div class="name">${b.displayName || b.author}</div>
        <div class="ts">${ts(b.createdAt)}</div>
      </div>
    </div>
    <div class="blog-title">${b.title}</div>
    <div class="blog-preview">${(b.preview || '').replace(/\n/g,'<br>')}</div>
    ${b.tags?.length ? `<div class="tags">${b.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
    <div class="card-foot">
      <button id="like-${b.id}" onclick="event.stopPropagation();quickLike('${b.id}',this)">❤️ ${b.likesCount}</button>
      <button onclick="event.stopPropagation();openBlog('${b.id}')">💬 ${b.commentsCount}</button>
      <button onclick="event.stopPropagation();openBlog('${b.id}')">Read →</button>
    </div>
  `;
  card.querySelector(`#cav-${b.id}`).replaceWith(mkAv(b.avatarUrl, b.displayName || b.author, 38));
  card.addEventListener('click', () => openBlog(b.id));
  return card;
}

async function quickLike(id, btn) {
  try {
    const d = await call('POST', '/blogs/' + id + '/like');
    btn.textContent = (d.liked ? '❤️' : '🤍') + ' ' + d.count;
  } catch (e) { toast(e.message, 'err'); }
}

async function openBlog(id) {
  currentBlogId = id;
  try {
    const b = await call('GET', '/blogs/' + id);
    g('blogModalTitle').textContent = b.title;
    g('blogModalContent').innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div id="blog-detail-av"></div>
        <div><div style="font-weight:600">${b.displayName || b.author}</div><div style="font-size:.78rem;color:var(--ink2)">${ts(b.createdAt)}</div></div>
      </div>
      ${b.tags?.length ? `<div class="tags" style="margin-bottom:14px">${b.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
      <div class="detail-body">${b.body.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>
      <div class="card-foot" style="margin-top:14px;border-top:1.5px solid var(--line);padding-top:10px;">
        <button id="detailLike" onclick="detailLike('${id}')">❤️ ${b.likes?.length || 0}</button>
      </div>
    `;
    g('blog-detail-av').replaceWith(mkAv(b.avatarUrl, b.displayName || b.author, 42));
    renderComments(b.comments || []);
    openModal('blogModal');
  } catch (e) { toast('Could not load post', 'err'); }
}

async function detailLike(id) {
  try {
    const d = await call('POST', '/blogs/' + id + '/like');
    g('detailLike').textContent = (d.liked ? '❤️' : '🤍') + ' ' + d.count;
  } catch (e) { toast(e.message, 'err'); }
}

function renderComments(comments) {
  g('commentHeading').textContent = 'Comments (' + comments.length + ')';
  const c = g('commentList');
  if (!comments.length) { c.innerHTML = '<p style="color:var(--ink2);font-size:.88rem;padding:8px 0">No comments yet.</p>'; return; }
  c.innerHTML = comments.map(c => `
    <div class="comment-card">
      <div class="comment-name">${c.displayName || c.author}</div>
      <div class="comment-text">${c.text}</div>
      <div class="comment-ts">${ts(c.createdAt)}</div>
    </div>
  `).join('');
}

async function submitComment() {
  const text = g('commentIn').value.trim();
  if (!text || !currentBlogId) return;
  try {
    await call('POST', '/blogs/' + currentBlogId + '/comments', { text });
    g('commentIn').value = '';
    const b = await call('GET', '/blogs/' + currentBlogId);
    renderComments(b.comments || []);
    toast('Comment added', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function submitPost() {
  const title = g('postTitle').value.trim();
  const body  = g('postBody').value.trim();
  const tags  = g('postTags').value.split(',').map(t => t.trim()).filter(Boolean);
  if (!title || !body) { toast('Title and content are required', 'err'); return; }
  try {
    await call('POST', '/blogs', { title, body, tags });
    closeModal('newPostModal');
    g('postTitle').value = ''; g('postBody').value = ''; g('postTags').value = '';
    toast('Published!', 'ok');
    await loadBlogs();
  } catch (e) { toast(e.message, 'err'); }
}

// ── Gallery ───────────────────────────────────────────────────────────
let gallery = [];

async function loadGallery() {
  try {
    gallery = await call('GET', '/gallery');
    renderGallery();
  } catch (_) {}
}

function renderGallery() {
  const grid = g('galleryGrid');
  if (!gallery.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="ico">📷</div><p>No photos yet. Upload the first one!</p></div>'; return; }
  grid.innerHTML = '';
  gallery.forEach(item => {
    const d = document.createElement('div');
    d.className = 'g-item';
    d.innerHTML = `
      <img src="${item.url}" alt="${item.filename}" loading="lazy" onerror="this.style.display='none'">
      <div class="g-overlay"><div class="g-overlay-text">${item.uploader} · ${ts(item.timestamp)}</div></div>
    `;
    d.onclick = () => openViewer(item);
    grid.appendChild(d);
  });
}

function openViewer(item) {
  g('viewerTitle').textContent = item.filename;
  g('viewerContent').innerHTML = item.type === 'video'
    ? `<video src="${item.url}" controls style="max-width:100%;max-height:58vh;border-radius:var(--radius)"></video>`
    : `<img src="${item.url}" style="max-width:100%;max-height:58vh;border-radius:var(--radius)" alt="${item.filename}">`;
  g('viewerInfo').textContent = `Uploaded by ${item.uploader} · ${ts(item.timestamp)} · ${(item.size/1024).toFixed(1)} KB`;
  openModal('viewerModal');
}

async function uploadGallery(event) {
  const files = [...event.target.files];
  if (!files.length) return;
  const pw = g('progWrap'), pb = g('progBar');
  pw.style.display = 'block'; pb.style.width = '5%';
  try {
    for (let i = 0; i < files.length; i++) {
      pb.style.width = ((i / files.length) * 90 + 5) + '%';
      const file   = files[i];
      const base64 = await toBase64(file);
      const d      = await call('POST', '/gallery/upload', {
        filename: file.name,
        type:     file.type.startsWith('video/') ? 'video' : 'image',
        dataUrl:  base64,
        size:     file.size,
      });
      if (d.item) gallery.unshift(d.item);
    }
    pb.style.width = '100%';
    renderGallery();
    toast(files.length + ' file(s) uploaded!', 'ok');
  } catch (e) { toast(e.message, 'err'); }
  finally { setTimeout(() => { pw.style.display = 'none'; pb.style.width = '0%'; }, 600); }
  event.target.value = '';
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ── Profile ───────────────────────────────────────────────────────────
async function saveProfile() {
  const displayName = g('pName').value.trim();
  const bio         = g('pBio').value.trim();
  try {
    const d = await call('PUT', '/profile', { displayName, bio });
    profile.displayName = d.displayName;
    profile.bio         = d.bio;
    renderTopAv(); renderBigAv();
    g('topName').textContent = d.displayName || username;
    const el = g('pMsg');
    el.textContent = 'Profile saved!'; el.className = 'msg-box ok';
    setTimeout(() => { el.className = 'msg-box'; el.textContent = ''; }, 2500);
    toast('Profile saved!', 'ok');
  } catch (e) {
    const el = g('pMsg');
    el.textContent = e.message; el.className = 'msg-box err';
  }
}

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast('Avatar must be under 2 MB', 'err'); return; }
  try {
    const dataUrl = await toBase64(file);
    await call('PUT', '/profile', { avatarUrl: dataUrl });
    profile.avatarUrl = dataUrl;
    renderTopAv(); renderBigAv();
    toast('Avatar updated!', 'ok');
  } catch (e) { toast(e.message, 'err'); }
  event.target.value = '';
}

// ── Boot ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (token && username) {
    startApp();
  } else {
    g('authWrap').style.display = 'flex';
  }
  // Close modals on backdrop click
  document.querySelectorAll('.backdrop').forEach(bd => {
    bd.addEventListener('click', e => { if (e.target === bd) bd.classList.remove('on'); });
  });
  // Enter key in auth
  g('aPass').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
});
</script>
